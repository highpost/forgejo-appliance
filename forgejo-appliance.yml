#cloud-config

# environment configuration
locale: en_US.UTF-8
environment:
  DEBIAN_FRONTEND: noninteractive

# package repositories configuration
apt:
  preserve_sources_list: true

# required packages
package_upgrade: true
packages:
  - git
  - git-lfs
  - postgresql
  - postgresql-client

# user provisioning
users:
  - name: forgejo
    uid: 1001
    shell: /bin/bash
    system: false
    comment: Forgejo Appliance service user
    home: /home/forgejo
    create_home: true
    lock_passwd: false
    passwd: "*"

# system files provisioning
write_files:
  # PostgreSQL HBA policy for trust auth on local connections
  - path: /etc/postgresql/${POSTGRES_VERSION}/main/pg_hba.conf
    owner: postgres:postgres
    permissions: '0640'
    defer: true
    content: |
      # TYPE  DATABASE        USER            ADDRESS                 METHOD
      local   all             all                                     trust
      host    all             all             127.0.0.1/32            trust
      host    all             all             ::1/128                 trust

  # Forgejo app.ini configuration
  - path: /etc/forgejo/app.ini
    owner: forgejo:forgejo
    permissions: '0660'
    defer: true
    content: |
      APP_NAME         = Forgejo Appliance
      RUN_USER         = forgejo
      WORK_PATH        = /var/lib/forgejo
      RUN_MODE         = prod

      [repository]
      ROOT             = /var/lib/forgejo/data/forgejo-repositories

      [server]
      DOMAIN           = YOUR_TAILSCALE_MACHINE_NAME.YOUR_TS_TAILNET.ts.net
      PROTOCOL         = http+unix
      HTTP_ADDR        = /run/forgejo/forgejo.sock
      HTTP_PORT        = 3000
      ROOT_URL         = https://YOUR_TAILSCALE_MACHINE_NAME.YOUR_TS_TAILNET.ts.net/
      DISABLE_SSH      = true

      [database]
      DB_TYPE          = postgres
      HOST             = /var/run/postgresql
      NAME             = forgejo
      USER             = forgejo
      PASSWORD         =
      SSL_MODE         = disable

      [security]
      INSTALL_LOCK     = true
      SECRET_KEY       = PlaceholderForAutogeneratedString

      [mailer]
      ENABLED          = true
      FROM             = "Forgejo notification" <forgejo-noreply@wordbasket.app>
      PROTOCOL         = smtps
      SMTP_ADDR        = smtp.gmail.com
      SMTP_PORT        = 465
      USER             = YOUR_GOOGLE_WORKSPACE_ACCOUNT
      PASSWD           = YOUR_GOOGLE_SMTP_PASSWORD
      FORCE_TRUST_SERVER_CERT = false

  # Forgejo systemd service unit declaration
  - path: /etc/systemd/system/forgejo.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Forgejo
      After=network-online.target postgresql.service
      Wants=network-online.target postgresql.service

      [Service]
      RestartSec=2s
      Type=simple
      User=forgejo
      Group=forgejo
      RuntimeDirectory=forgejo
      RuntimeDirectoryMode=0755
      StateDirectory=forgejo forgejo/custom forgejo/data forgejo/log
      StateDirectoryMode=0770
      ConfigurationDirectory=forgejo
      ConfigurationDirectoryMode=0770
      WorkingDirectory=/var/lib/forgejo
      ExecStart=/home/forgejo/bin/forgejo web --config /etc/forgejo/app.ini
      Restart=always
      Environment='USER=forgejo HOME=/home/forgejo FORGEJO_WORK_DIR=/var/lib/forgejo PGUSER=forgejo PATH=/home/forgejo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'

      [Install]
      WantedBy=multi-user.target

  # tsbridge TOML configuration file
  - path: /etc/tsbridge/tsbridge.toml
    owner: root:root
    permissions: '0600'
    content: |
      [tailscale]
      oauth_client_id_env = "TS_OAUTH_CLIENT_ID"
      oauth_client_secret_env = "TS_OAUTH_CLIENT_SECRET"
      default_tags = ["tag:myservers"]
      state_dir    = "/var/lib/tsbridge"
      listen_addr  = ":443"

      # web traffic (maps Tailnet HTTPS -> local UNIX socket)
      [[services]]
      name         = "YOUR_TAILSCALE_MACHINE_NAME"
      hostname     = "YOUR_TAILSCALE_MACHINE_NAME"
      backend_addr = "unix:///run/forgejo/forgejo.sock"

  # tsbridge systemd service unit configuration
  - path: /etc/systemd/system/tsbridge.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Tailscale Bridge Proxy Manager
      After=network-online.target forgejo.service
      Wants=network-online.target forgejo.service

      [Service]
      Type=simple
      StateDirectory=tsbridge
      StateDirectoryMode=0700
      ConfigurationDirectory=tsbridge
      ExecStart=/usr/local/bin/tsbridge -config /etc/tsbridge/tsbridge.toml
      Restart=always
      RestartSec=5s
      EnvironmentFile=-/etc/tsbridge/tsbridge.env

      [Install]
      WantedBy=multi-user.target

# post-provisioning shell commands
runcmd:
  # reload PostgreSQL to apply pg_hba.conf and create the default user and database
  - systemctl reload postgresql
  - until pg_isready; do sleep 1; done
  - sudo -u postgres psql -c "CREATE USER forgejo;"
  - sudo -u postgres psql -c "CREATE DATABASE forgejo OWNER forgejo;"

  # download, extract and install the Forgejo Linux arm64 binary
  - install -d -o forgejo -g forgejo -m 0755 /home/forgejo/bin
  - curl -L https://codeberg.org/forgejo/forgejo/releases/download/v${FORGEJO_VERSION}/forgejo-${FORGEJO_VERSION}-linux-arm64.xz -o /tmp/forgejo.xz
  - unxz /tmp/forgejo.xz
  - install -o forgejo -g forgejo -m 0755 /tmp/forgejo /home/forgejo/bin/forgejo
  - rm -f /tmp/forgejo

  # download, extract and install the tsbridge binary
  - curl -L https://github.com/jtdowney/tsbridge/releases/download/v${TSBRIDGE_VERSION}/tsbridge_${TSBRIDGE_VERSION}_linux_arm64.tar.gz -o /tmp/tsbridge.tar.gz
  - tar -xzf /tmp/tsbridge.tar.gz -C /usr/local/bin/
  - chmod 755 /usr/local/bin/tsbridge
  - rm -f /tmp/tsbridge.tar.gz

  # generate a random string for SECRET_KEY and inject it into the Forgejo configuration
  - sed -i "s|PlaceholderForAutogeneratedString|$(openssl rand -hex 32)|g" /etc/forgejo/app.ini

  # launch Forgejo and ready the system layer
  - systemctl daemon-reload
  - systemctl enable --now forgejo
